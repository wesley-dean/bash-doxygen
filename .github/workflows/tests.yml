---
name: Tests

# yamllint disable-line rule:truthy
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run test suite
        run: sh ./test/run-tests.sh
