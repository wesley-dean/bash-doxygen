---
name: Tests

# yamllint disable-line rule:truthy
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gawk

      - name: Validate maintained AWK source
        run: make check

      - name: Synchronize and verify build dependencies
        run: |
          make deps
          make deps-check

      - name: Run test suite
        run: |
          if make test; then
            exit 0
          fi

          if [ -f dist/doxygen-bash.awk ] && [ -f vendor/awk-minifier.awk ]; then
            body="${RUNNER_TEMP}/doxygen-bash.body.awk"
            sed '1,/^# End generated header\.$/d' dist/doxygen-bash.awk >"${body}"
            total="$(wc -l <"${body}" | tr -d '[:space:]')"
            n=1
            while [ "${n}" -le "${total}" ]; do
              if ! head -n "${n}" "${body}" |
                awk -f vendor/awk-minifier.awk >/dev/null 2>"${RUNNER_TEMP}/minifier.err"; then
                start=$((n - 2))
                [ "${start}" -gt 0 ] || start=1
                end=$((n + 2))
                printf '%s\n' "First rejected complete-line prefix ends at body line ${n}:"
                nl -ba "${body}" | sed -n "${start},${end}p"
                cat "${RUNNER_TEMP}/minifier.err"
                break
              fi
              n=$((n + 1))
            done
          fi
          exit 1
